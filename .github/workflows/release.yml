name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Fyne deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
          go install fyne.io/fyne/v2/cmd/fyne@latest
      - name: Tidy modules
        run: go mod tidy
      - name: Build Linux
        run: fyne package -os linux -name mhmtscanner -appVersion "${{ steps.version.outputs.version }}"
      - name: Ensure output filename
        run: mv *.tar.xz mhmtscanner.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: mhmtscanner.tar.xz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Fyne
        run: go install fyne.io/fyne/v2/cmd/fyne@latest
      - name: Tidy modules
        run: go mod tidy
      - name: Build Windows
        run: fyne package -os windows -name mhmtscanner -appVersion "${{ steps.version.outputs.version }}"
      - name: Ensure output filename
        shell: bash
        run: mv *.exe mhmtscanner.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: mhmtscanner.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "ndk;25.2.9519653"
      - name: Install gomobile + fyne
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install fyne.io/fyne/v2/cmd/fyne@latest
          gomobile init
      - name: Tidy modules
        run: go mod tidy
      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
        run: fyne package -os android -appID com.mehmmet.mhmtsc -name "MHMT Scanner" -appVersion "${{ steps.version.outputs.version }}"
      - name: Ensure output filename
        run: mv *.apk mhmtscanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: mhmtscanner.apk

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-build/*
            artifacts/windows-build/*
            artifacts/android-build/*
          generate_release_notes: true
          body: |
            ## 📥 راهنمای دانلود و نصب

            **کدوم فایل مال کدوم سیستم‌عامله؟**
            - `mhmtscanner.apk` → اندروید (گوشی/تبلت)
            - `mhmtscanner.exe` → ویندوز
            - `mhmtscanner.tar.xz` → لینوکس

            ### 🤖 نصب روی اندروید
            1. فایل `mhmtscanner.apk` رو دانلود کن
            2. اگه گوشیت پیام «از این منبع مجاز نیست» داد، برو تنظیمات → امنیت (یا «نصب از منابع ناشناس») و برای مرورگر/فایل‌منیجرت اجازه بده
            3. فایل رو باز کن و نصب رو تایید کن

            ### 🪟 اجرا روی ویندوز
            1. فایل `mhmtscanner.exe` رو دانلود کن — نیازی به نصب نداره، مستقیم اجرا می‌شه
            2. چون این فایل امضای دیجیتال (code signing) نداره، ممکنه ویندوز پیام آبی «Windows protected your PC» نشون بده — این یعنی فقط ناشناخته‌ست، نه خطرناک
            3. روی **More info** بزن، بعد **Run anyway** رو بزن تا اجرا بشه

            ### 🐧 اجرا روی لینوکس
            1. فایل `mhmtscanner.tar.xz` رو دانلود کن
            2. با دستور زیر از حالت فشرده خارجش کن:
               ```
               tar -xf mhmtscanner.tar.xz
               ```
            3. فایل اجرایی داخلش رو با دوبار کلیک یا از ترمینال اجرا کن

            ---

            ## 📝 تغییرات این نسخه

