name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Fyne deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
          go install fyne.io/fyne/v2/cmd/fyne@latest
      - name: Tidy modules
        run: go mod tidy
      - name: Build Linux
        run: fyne package -os linux -name mhmtscanner
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: mhmtscanner.tar.xz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Fyne
        run: go install fyne.io/fyne/v2/cmd/fyne@latest
      - name: Tidy modules
        run: go mod tidy
      - name: Build Windows
        run: fyne package -os windows -name mhmtscanner
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: mhmtscanner.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "ndk;25.2.9519653"
      - name: Install gomobile + fyne
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install fyne.io/fyne/v2/cmd/fyne@latest
          gomobile init
      - name: Tidy modules
        run: go mod tidy
      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
        run: fyne package -os android -appID com.mehmmet.mhmtsc -name mhmtscanner
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: mhmtscanner.apk

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-build/*
            artifacts/windows-build/*
            artifacts/android-build/*
          generate_release_notes: true
